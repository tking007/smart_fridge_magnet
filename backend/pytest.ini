[pytest]
# testpaths 让 `pytest`（不带参数）与 `pytest tests/` 行为一致，
# 避免有人在 backend/ 根目录直接跑 pytest 时把 .venv 里的第三方测试也收集进来。
testpaths = tests

# 只收集 tests/ 下的 test_*.py。显式写出来是因为默认值还包含 *_test.py，
# 而本项目没有那种命名，写死可以减少一次「为什么这个文件没跑」的排查。
python_files = test_*.py

# 失败即显示简短回溯：这些测试大量使用 check() 累积断言，长回溯没有额外信息。
addopts = --tb=short -ra

markers =
    integration: 需要一个真实运行的后端服务器（默认跳过，用 --run-integration 打开）

# DeprecationWarning 在本项目里目前有真实待办（datetime.utcnow），
# 保持可见但不失败，避免噪音淹没真正的失败信息。
filterwarnings =
    default
