name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - run: SFM_LOG_DIR="$RUNNER_TEMP/sfm-logs" python -m pytest -q
      - run: ruff check --no-cache src tests scripts

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest :app:assembleDebug lintDebug --no-daemon

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run firmware host tests
        working-directory: embedded/smart_fridge_magnet
        run: bash test/host/run_host_tests.sh

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON and shell scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', 'build', 'managed_components'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          PY
          bash -n android/build-apk.sh backend/scripts/verify_cloud_link.sh embedded/smart_fridge_magnet/certs/gen-ca.sh
